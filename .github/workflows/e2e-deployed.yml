name: E2E (deployed)

# Vercel reports each deployment to GitHub. When one succeeds (a PR preview
# or production), run the smoke test against the URL Vercel actually deployed.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (${{ github.event.deployment_status.environment }})
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Repository secret, copied from Vercel's "Protection Bypass for Automation".
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-deployed
          path: test-results/
          retention-days: 7
