name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only need to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the run that's now out of date. Pushes to
# main are never cancelled, so every commit on main gets a complete CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    # GitHub's default is 6 hours; a hung job should fail fast instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` installs exactly what package-lock.json says, and fails if
      # package.json and the lockfile disagree. Use it instead of `npm install` in CI.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Postgres 18 next to the job, matching local Docker and Neon.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feature_requests_test
        ports:
          - 5432:5432
        # Don't start the job's steps until the database accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d feature_requests_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/feature_requests_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end (local production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Downloads Chromium plus the Linux system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # On failure, keep Playwright's traces so the failure can be replayed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
